name: Deploy Cirkus

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for Azure OIDC login
  contents: read
  packages: write    # required to push to ghcr.io

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: rg-cirkus
  CONTAINERAPPS_ENV: cae-cirkus
  CONTAINERAPP_NAME: cirkus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast on type errors here, in Actions, rather than discovering
      # them as a crash-looping container after the deploy step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and type-check
        run: |
          npm ci
          npm run check

      - name: Compute lowercase image name
        # ghcr.io requires an all-lowercase path; github.repository preserves case.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            # `az containerapp up` doesn't accept --secrets (still true as of
            # az cli 2.89.1 / see Azure/azure-container-apps#340), so secrets
            # and the env var that references one are wired up afterward.
            az containerapp up \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINERAPPS_ENV }} \
              --image ${{ env.IMAGE }}:${{ github.sha }} \
              --target-port 3000 \
              --ingress external

            az containerapp secret set \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets database-url=${{ secrets.DATABASE_URL }}

            # BODY_SIZE_LIMIT: adapter-node refuses request bodies over 512 KB
            # by default; receipt photos are bigger (see README, Azure gotchas).
            # --revision-suffix forces a fresh revision on every run, including
            # re-runs of an unchanged commit. Without it Azure treats an
            # identical image tag as "no change" and keeps whatever revision
            # was last healthy — which hides a crash-looping new revision.
            az containerapp update \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --set-env-vars DATABASE_URL=secretref:database-url BODY_SIZE_LIMIT=15M \
              --revision-suffix r${{ github.run_number }}-${{ github.run_attempt }}
