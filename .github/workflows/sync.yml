name: Sync invoices from Procountor

# Wakes the app once an hour and asks it to pull invoice statuses from
# Procountor (paid / not paid). The app also syncs when someone opens
# Billing or Invoices, throttled to once per 15 minutes; this keeps the
# statuses fresh on days nobody logs in. Secrets: CIRKUS_URL (the app's
# public URL, no trailing slash) and PROCOUNTOR_SYNC_SECRET (the same value
# the Container App has in its PROCOUNTOR_SYNC_SECRET env var).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/sync
        run: |
          code=$(curl -sS -o body.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.PROCOUNTOR_SYNC_SECRET }}" \
            "${{ secrets.CIRKUS_URL }}/internal/sync")
          echo "HTTP $code"; cat body.txt; echo
          test "$code" = "200"
